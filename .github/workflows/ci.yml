name: PhishNetra CI/CD & Security Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-node-monorepo:
    name: Node.js Monorepo (Shared, API, Web, Extension)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Types Package
        run: npm run build:shared

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Push Prisma Database Schema for Testing
        run: npx prisma db push --schema=prisma/schema.prisma --accept-data-loss
        env:
          DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"

      - name: Run API Automated Jest Test Suite
        run: npm --prefix apps/api test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_123456789
          DATABASE_URL: "file:${{ github.workspace }}/prisma/dev.db"

      - name: Run Extension Automated Jest Test Suite
        run: npm --prefix apps/extension test

      - name: Validate React Web Frontend Build
        run: npm --prefix apps/web run build

  validate-python-ml:
    name: Python ML Inference Microservice
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ml/requirements.txt

      - name: Train ML Model Artifact for Platform
        working-directory: services/ml
        run: |
          python training/train.py

      - name: Run ML Unit, Explainability & Adversarial Tests
        working-directory: services/ml
        run: |
          python -m pytest tests -v --tb=short
        env:
          PYTHONPATH: .



