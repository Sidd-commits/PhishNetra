name: PhishNetra CI/CD & Security Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-node-monorepo:
    name: Node.js Monorepo (Shared, API, Web, Extension)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Types Package
        run: npm run build:shared

      - name: Generate Prisma Client
        run: npm --prefix apps/api run prisma:generate

      - name: Run API Automated Jest Test Suite
        run: npm --prefix apps/api test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_123456789
          DATABASE_URL: "file:./test.db"

      - name: Run Extension Automated Jest Test Suite
        run: npm --prefix apps/extension test

      - name: Validate React Web Frontend Build
        run: npm --prefix apps/web run build

  validate-python-ml:
    name: Python ML Inference Microservice
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ml/requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run ML Unit, Explainability & Adversarial Tests
        run: |
          python -m pytest services/ml/tests
