version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: phishnetra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: phishnetra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phishnetra"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    container_name: phishnetra-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=info

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: phishnetra-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/phishnetra?schema=public
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=phishnetra_docker_jwt_secret_dev_key_123456
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

volumes:
  postgres_data:
    driver: local
